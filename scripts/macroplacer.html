<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRAM Macro Placer (Standalone)</title>
    <style>
        /* --- CSS Reset & Base Styles --- */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; display: flex; color: #1e293b; background: #f8fafc; }
        
        /* --- Layout --- */
        #app { display: flex; width: 100%; height: 100%; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; box-shadow: 4px 0 24px rgba(0,0,0,0.05); }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid #e2e8f0; background: #f1f5f9; display: flex; align-items: center; gap: 0.5rem; font-weight: bold; color: #334155; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 1rem; }
        .sidebar-footer { padding: 1rem; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; gap: 0.5rem; }
        
        /* Sections */
        .section { margin-bottom: 1.5rem; }
        .section-title { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; }
        
        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.5rem; }
        .form-group label { display: block; font-size: 0.75rem; color: #64748b; margin-bottom: 0.25rem; }
        input[type="number"], input[type="text"] { width: 100%; padding: 0.375rem; border: 1px solid #cbd5e1; border-radius: 0.25rem; font-size: 0.875rem; background: #f8fafc; }
        input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        
        /* Library Items */
        .lib-item { border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem; background: #f8fafc; margin-bottom: 0.5rem; transition: border-color 0.2s; }
        .lib-item:hover { border-color: #93c5fd; }
        .lib-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; }
        .lib-input { border: none; background: transparent; font-weight: 500; font-size: 0.875rem; width: 100%; }
        
        /* Instance List */
        .inst-list { max-height: 200px; overflow-y: auto; }
        .inst-item { padding: 0.5rem; border-radius: 0.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-bottom: 2px; }
        .inst-item:hover { background: #f1f5f9; }
        .inst-item.selected { background: #dbeafe; color: #1e40af; }
        
        /* Buttons */
        .btn { padding: 0.375rem 0.75rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; border: 1px solid #cbd5e1; background: white; color: #475569; transition: all 0.2s; }
        .btn:hover { background: #f1f5f9; }
        .btn-primary { background: #1e293b; color: white; border-color: #1e293b; }
        .btn-primary:hover { background: #334155; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .btn-icon { padding: 0.25rem; border: none; background: transparent; color: #64748b; }
        .btn-icon:hover { color: #3b82f6; background: #eff6ff; }
        
        /* Canvas Area */
        .main-area { flex: 1; position: relative; background: #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
        .viewport { flex: 1; position: relative; cursor: grab; overflow: hidden; }
        .viewport.grabbing { cursor: grabbing; }
        
        /* Toolbar */
        .toolbar { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); padding: 0.5rem; border-radius: 9999px; display: flex; gap: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; z-index: 20; align-items: center; }
        .toolbar-sep { width: 1px; height: 1.5rem; background: #e2e8f0; margin: 0 0.25rem; }
        
        /* Chip Rendering */
        .chip-container { transform-origin: 0 0; position: absolute; }
        .chip { background: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; border: 1px solid #cbd5e1; }
        
        /* Macro Instance */
        .macro { position: absolute; border: 2px solid rgba(0,0,0,0.2); cursor: move; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; transition: box-shadow 0.1s; }
        .macro:hover { border-color: rgba(0,0,0,0.5); }
        .macro.selected { border-color: #000; z-index: 10; box-shadow: 0 0 0 2px #60a5fa; }
        .macro-label { font-size: 10px; font-weight: bold; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
        .macro-sublabel { font-size: 8px; color: rgba(255,255,255,0.9); text-shadow: 0 1px 2px rgba(0,0,0,0.5); pointer-events: none; }
        .orientation-arrow { position: absolute; top: 0; right: 0; padding: 2px; pointer-events: none; }
        .arrow-shape { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 8px solid rgba(0,0,0,0.4); }
        
        /* Overlays */
        .keepout-overlay { position: absolute; border: 2px dashed #fca5a5; background: rgba(254, 242, 242, 0.2); pointer-events: none; }
        
        /* Modal */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: none; align-items: center; justify-content: center; }
        .modal-backdrop.open { display: flex; }
        .modal { background: white; padding: 1.5rem; border-radius: 0.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        /* Helpers */
        .hidden { display: none; }
        
        /* SVG Icons */
        svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

<div id="app">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <svg viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            <span>Macro Placer</span>
        </div>
        
        <div class="sidebar-content">
            <!-- Chip Settings -->
            <div class="section">
                <div class="section-title">
                    <span>Chip Settings</span>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Width (um)</label>
                        <input type="number" id="chipWidth" value="4000">
                    </div>
                    <div class="form-group">
                        <label>Height (um)</label>
                        <input type="number" id="chipHeight" value="5200">
                    </div>
                </div>
                <div class="form-group">
                    <label>Snap Grid (um)</label>
                    <input type="number" id="chipGrid" value="1">
                </div>
                <div style="margin-top: 0.5rem; font-size: 0.7rem; color: #94a3b8; padding: 0.5rem; border: 1px solid #f1f5f9; border-radius: 0.25rem;">
                    Usable: (442, 442) to (3490, 4680)
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 1rem 0;">

            <!-- Library -->
            <div class="section">
                <div class="section-title">
                    <span>Macro Library</span>
                    <button class="btn-icon" id="addDefBtn" title="Add New Definition">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </button>
                </div>
                <div id="libraryList">
                    <!-- Library Items Rendered Here -->
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 1rem 0;">

            <!-- Instances -->
            <div class="section">
                <div class="section-title">
                    <span>Placed Macros (<span id="instCount">0</span>)</span>
                </div>
                <div id="instanceList" class="inst-list">
                    <!-- Instance Items Rendered Here -->
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <input type="file" id="fileInput" accept=".yaml,.yml" class="hidden">
            <button class="btn" id="importBtn" style="flex: 1;">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                Import
            </button>
            <button class="btn btn-primary" id="exportBtn" style="flex: 1;">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Export
            </button>
        </div>
    </div>

    <!-- Main Canvas -->
    <div class="main-area">
        <!-- Floating Toolbar -->
        <div class="toolbar">
            <button class="btn-icon" id="zoomOutBtn" title="Zoom Out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
            <span style="font-family: monospace; font-size: 10px; width: 40px; text-align: center;" id="zoomLabel">15%</span>
            <button class="btn-icon" id="zoomInBtn" title="Zoom In"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg></button>
            
            <div class="toolbar-sep"></div>

            <button class="btn-icon" id="selectAllBtn" title="Select All"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 12l2 2 4-4"/></svg></button>

            <button class="btn-icon" id="renameBtn" title="Rename"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
            <button class="btn-icon" id="rotateBtn" title="Rotate"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
            
            <div class="toolbar-sep"></div>

            <button class="btn-icon" id="flipHBtn" title="Flip Horizontal"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" x2="12" y1="3" y2="21"/></svg></button>
            <button class="btn-icon" id="flipVBtn" title="Flip Vertical"><svg viewBox="0 0 24 24"><path d="M21 8v-3a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/><line x1="3" x2="21" y1="12" y2="12"/></svg></button>

            <div class="toolbar-sep"></div>

            <button class="btn-icon" id="deleteBtn" style="color: #ef4444;" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
        </div>

        <div id="viewport" class="viewport">
            <div id="panContainer" class="chip-container" style="transform: translate(80px, 80px);">
                <div id="chipBoard" class="chip">
                    <!-- Grid, Macros, Overlay -->
                    <div id="gridLayer" style="position: absolute; inset: 0; pointer-events: none;"></div>
                    <div id="keepoutLayer" class="keepout-overlay"></div>
                    <div id="macroLayer"></div>
                    
                    <!-- Labels -->
                    <div class="absolute-label" style="position: absolute; bottom: -20px; left: 0; font-size: 10px; color: #64748b; font-family: monospace;">0,0</div>
                </div>
            </div>
        </div>
        
        <div style="background: white; border-top: 1px solid #e2e8f0; padding: 0.25rem 1rem; font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between;">
            <span id="statusText">No Selection</span>
            <span>Select: Click / Ctrl+Click | Move: Drag / Arrow Keys | DblClick: Rename</span>
        </div>
    </div>
</div>

<!-- Rename Modal -->
<div id="renameModal" class="modal-backdrop">
    <div class="modal">
        <h3 style="margin-top: 0; font-size: 1.125rem; font-weight: bold; color: #1e293b;">Rename Instance</h3>
        <div class="form-group" style="margin-top: 1rem;">
            <label>New Name</label>
            <input type="text" id="renameInput">
            <div id="renameError" style="color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem; min-height: 1rem;"></div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
            <button class="btn" id="cancelRenameBtn">Cancel</button>
            <button class="btn btn-primary" id="saveRenameBtn">Save</button>
        </div>
    </div>
</div>

<script>
    // --- Constants ---
    const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
    const USABLE_AREA = { x1: 442, y1: 442, x2: 3490, y2: 4680 };
    
    // --- State ---
    const state = {
        chip: { width: 4000, height: 5200, gridSize: 1 },
        library: [
            { id: 'gf_1', name: 'gf180mcu_fd_ip_sram__sram512x8m8wm1', width: 432, height: 485, color: COLORS[0] },
            { id: 'gf_2', name: 'gf180mcu_fd_ip_sram__sram256x8m8wm1', width: 432, height: 341, color: COLORS[1] }
        ],
        instances: [],
        selectedIds: [], // Changed from selectedId
        view: { scale: 0.15, x: 80, y: 80 },
        drag: null, // { type: 'MACRO'|'CANVAS', id, startX, startY, initX, initY }
        modal: { open: false, id: null }
    };

    // --- DOM Elements ---
    const els = {
        chipWidth: document.getElementById('chipWidth'),
        chipHeight: document.getElementById('chipHeight'),
        chipGrid: document.getElementById('chipGrid'),
        libraryList: document.getElementById('libraryList'),
        instanceList: document.getElementById('instanceList'),
        instCount: document.getElementById('instCount'),
        panContainer: document.getElementById('panContainer'),
        chipBoard: document.getElementById('chipBoard'),
        macroLayer: document.getElementById('macroLayer'),
        keepoutLayer: document.getElementById('keepoutLayer'),
        gridLayer: document.getElementById('gridLayer'),
        viewport: document.getElementById('viewport'),
        zoomLabel: document.getElementById('zoomLabel'),
        statusText: document.getElementById('statusText'),
        fileInput: document.getElementById('fileInput'),
        renameModal: document.getElementById('renameModal'),
        renameInput: document.getElementById('renameInput'),
        renameError: document.getElementById('renameError'),
        
        zoomInBtn: document.getElementById('zoomInBtn'),
        zoomOutBtn: document.getElementById('zoomOutBtn'),
        selectAllBtn: document.getElementById('selectAllBtn'),
        renameBtn: document.getElementById('renameBtn'),
        rotateBtn: document.getElementById('rotateBtn'),
        flipHBtn: document.getElementById('flipHBtn'),
        flipVBtn: document.getElementById('flipVBtn'),
        deleteBtn: document.getElementById('deleteBtn'),
        cancelRenameBtn: document.getElementById('cancelRenameBtn'),
        saveRenameBtn: document.getElementById('saveRenameBtn'),
        importBtn: document.getElementById('importBtn'),
        exportBtn: document.getElementById('exportBtn'),
    };

    // --- Helpers ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const snap = (val, grid) => Math.round(val / grid) * grid;
    const rotateOrient = (o) => ({'N':'E','E':'S','S':'W','W':'N'})[o];
    
    const getRenderDim = (def, orient) => {
        const rotated = orient === 'E' || orient === 'W';
        return { w: rotated ? def.height : def.width, h: rotated ? def.width : def.height };
    };

    // --- Rendering ---
    
    function render() {
        // 1. Chip Board Dimensions
        const pxW = state.chip.width * state.view.scale;
        const pxH = state.chip.height * state.view.scale;
        
        els.panContainer.style.transform = `translate(${state.view.x}px, ${state.view.y}px)`;
        els.chipBoard.style.width = `${pxW}px`;
        els.chipBoard.style.height = `${pxH}px`;

        // 2. Keepout Overlay
        const kW = (USABLE_AREA.x2 - USABLE_AREA.x1) * state.view.scale;
        const kH = (USABLE_AREA.y2 - USABLE_AREA.y1) * state.view.scale;
        els.keepoutLayer.style.width = `${kW}px`;
        els.keepoutLayer.style.height = `${kH}px`;
        els.keepoutLayer.style.left = `${USABLE_AREA.x1 * state.view.scale}px`;
        els.keepoutLayer.style.bottom = `${USABLE_AREA.y1 * state.view.scale}px`;

        // 3. Grid
        renderGrid(pxW, pxH);

        // 4. Macros
        renderMacros();

        // 5. Sidebar Lists
        renderLibrary();
        renderInstanceList();

        // 6. UI Updates
        els.zoomLabel.textContent = (state.view.scale).toFixed(3);
        updateStatus();
    }

    function renderGrid(w, h) {
        els.gridLayer.innerHTML = '';
        const step = Math.max(state.chip.gridSize, 100);
        const pxStep = step * state.view.scale;
        if (pxStep < 5) return; 

        let svg = `<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;
        for (let x = 0; x <= state.chip.width; x += step) {
            let px = x * state.view.scale;
            svg += `<line x1="${px}" y1="0" x2="${px}" y2="${h}" stroke="#e2e8f0" stroke-width="1"/>`;
        }
        for (let y = 0; y <= state.chip.height; y += step) {
            let py = h - (y * state.view.scale);
            svg += `<line x1="0" y1="${py}" x2="${w}" y2="${py}" stroke="#e2e8f0" stroke-width="1"/>`;
        }
        svg += `</svg>`;
        els.gridLayer.innerHTML = svg;
    }

    function renderMacros() {
        els.macroLayer.innerHTML = '';
        state.instances.forEach(inst => {
            const def = state.library.find(d => d.id === inst.defId);
            if (!def) return;
            
            const dim = getRenderDim(def, inst.orientation);
            const el = document.createElement('div');
            const isSelected = state.selectedIds.includes(inst.id);
            
            el.className = `macro ${isSelected ? 'selected' : ''}`;
            el.style.width = `${dim.w * state.view.scale}px`;
            el.style.height = `${dim.h * state.view.scale}px`;
            el.style.left = `${inst.x * state.view.scale}px`;
            el.style.bottom = `${inst.y * state.view.scale}px`;
            el.style.backgroundColor = def.color;
            el.style.opacity = '0.9';

            let rotDeg = 0;
            if (inst.orientation === 'E') rotDeg = 90;
            if (inst.orientation === 'S') rotDeg = 180;
            if (inst.orientation === 'W') rotDeg = -90;

            el.innerHTML = `
                <div class="orientation-arrow" style="transform: rotate(${rotDeg}deg);">
                    <div class="arrow-shape"></div>
                </div>
                <div class="macro-label">${inst.name}</div>
                ${state.view.scale > 0.1 ? `<div class="macro-sublabel">${def.name}</div>` : ''}
            `;

            el.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                // Ctrl/Cmd click for multi-select
                const isMulti = e.ctrlKey || e.metaKey;
                selectInstance(inst.id, isMulti);
                startDrag(e, 'MACRO', inst.id);
            });
            
            el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if(state.selectedIds.length === 1) openRenameModal(inst.id);
            });

            els.macroLayer.appendChild(el);
        });
    }

    function renderLibrary() {
        els.libraryList.innerHTML = '';
        state.library.forEach(def => {
            const div = document.createElement('div');
            div.className = 'lib-item';
            div.innerHTML = `
                <div class="lib-header">
                    <div class="color-dot" style="background:${def.color}"></div>
                    <input class="lib-input name-input" data-id="${def.id}" value="${def.name}">
                </div>
                <div class="form-grid" style="font-size:0.75rem; margin-bottom:0.25rem;">
                    <div style="display:flex; align-items:center; gap:4px;">
                        <span style="color:#94a3b8">W:</span>
                        <input type="number" class="dim-input" data-id="${def.id}" data-field="width" value="${def.width}" style="padding:2px;">
                    </div>
                    <div style="display:flex; align-items:center; gap:4px;">
                        <span style="color:#94a3b8">H:</span>
                        <input type="number" class="dim-input" data-id="${def.id}" data-field="height" value="${def.height}" style="padding:2px;">
                    </div>
                </div>
                <button class="btn btn-sm" style="width:100%" onclick="addInstance('${def.id}')">+ Add Instance</button>
            `;
            els.libraryList.appendChild(div);
        });
        
        document.querySelectorAll('.lib-input.name-input').forEach(i => {
            i.onchange = (e) => updateDef(e.target.dataset.id, 'name', e.target.value);
        });
        document.querySelectorAll('.dim-input').forEach(i => {
            i.onchange = (e) => updateDef(e.target.dataset.id, e.target.dataset.field, parseFloat(e.target.value));
        });
    }

    function renderInstanceList() {
        els.instanceList.innerHTML = '';
        els.instCount.textContent = state.instances.length;
        state.instances.forEach(inst => {
            const div = document.createElement('div');
            const isSelected = state.selectedIds.includes(inst.id);
            div.className = `inst-item ${isSelected ? 'selected' : ''}`;
            div.innerHTML = `<span>${inst.name}</span><span style="color:#94a3b8; font-family:monospace;">(${inst.x},${inst.y})</span>`;
            div.onclick = (e) => selectInstance(inst.id, e.ctrlKey || e.metaKey);
            els.instanceList.appendChild(div);
        });
    }

    function updateStatus() {
        const count = state.selectedIds.length;
        if (count === 0) {
            els.statusText.textContent = "No Selection";
        } else if (count === 1) {
            const inst = state.instances.find(i => i.id === state.selectedIds[0]);
            if (inst) {
                els.statusText.textContent = `Selected: ${inst.name} (${inst.x}, ${inst.y}) ${inst.orientation}`;
            }
        } else {
            els.statusText.textContent = `Multiple Selection (${count} items)`;
        }
    }

    // --- Actions ---

    function updateDef(id, field, val) {
        const def = state.library.find(d => d.id === id);
        if (def) {
            def[field] = val;
            render();
        }
    }

    function addInstance(defId) {
        const def = state.library.find(d => d.id === defId);
        let idx = 1;
        let name = `${def.name}_inst${idx}`;
        while (state.instances.some(i => i.name === name)) {
            idx++;
            name = `${def.name}_inst${idx}`;
        }
        const inst = {
            id: generateId(),
            defId,
            name,
            x: USABLE_AREA.x1,
            y: USABLE_AREA.y1,
            orientation: 'N'
        };
        state.instances.push(inst);
        selectInstance(inst.id); // Single select new item
    }

    function selectInstance(id, isMulti = false) {
        if (isMulti) {
            const idx = state.selectedIds.indexOf(id);
            if (idx >= 0) {
                state.selectedIds.splice(idx, 1);
            } else {
                state.selectedIds.push(id);
            }
        } else {
            // If already selected and part of multi-select, don't clear unless clicking outside or simple click
            // For simple click logic:
            state.selectedIds = [id];
        }
        render();
    }

    function selectAll() {
        state.selectedIds = state.instances.map(i => i.id);
        render();
    }

    function deleteInstance() {
        if (state.selectedIds.length === 0) return;
        state.instances = state.instances.filter(i => !state.selectedIds.includes(i.id));
        state.selectedIds = [];
        render();
    }

    function rotateInstance() {
        if (state.selectedIds.length === 0) return;
        state.selectedIds.forEach(id => {
            const inst = state.instances.find(i => i.id === id);
            if(inst) inst.orientation = rotateOrient(inst.orientation);
        });
        render();
    }

    // Global Flips (Entire Design) - as requested originally
    function flipH() {
        state.instances.forEach(inst => {
            const def = state.library.find(d => d.id === inst.defId);
            const dim = getRenderDim(def, inst.orientation);
            inst.x = snap(state.chip.width - inst.x - dim.w, state.chip.gridSize);
            inst.orientation = (inst.orientation === 'E') ? 'W' : (inst.orientation === 'W') ? 'E' : inst.orientation;
        });
        render();
    }

    function flipV() {
        state.instances.forEach(inst => {
            const def = state.library.find(d => d.id === inst.defId);
            const dim = getRenderDim(def, inst.orientation);
            inst.y = snap(state.chip.height - inst.y - dim.h, state.chip.gridSize);
            inst.orientation = (inst.orientation === 'N') ? 'S' : (inst.orientation === 'S') ? 'N' : inst.orientation;
        });
        render();
    }

    // --- Keyboard Shifting ---
    window.addEventListener('keydown', (e) => {
        if (state.selectedIds.length === 0) return;
        
        // Ignore if typing in input
        if (e.target.tagName === 'INPUT') return;

        let dx = 0; 
        let dy = 0;
        const grid = Math.max(state.chip.gridSize, 1);

        switch(e.key) {
            case 'ArrowUp':    dy = grid; break;
            case 'ArrowDown':  dy = -grid; break;
            case 'ArrowLeft':  dx = -grid; break;
            case 'ArrowRight': dx = grid; break;
            default: return;
        }

        e.preventDefault(); // prevent scroll

        state.selectedIds.forEach(id => {
            const inst = state.instances.find(i => i.id === id);
            if (inst) {
                inst.x += dx;
                inst.y += dy;
            }
        });
        render();
    });

    // --- Drag Logic ---

    function startDrag(e, type, id) {
        const inst = (type === 'MACRO') ? state.instances.find(i => i.id === id) : null;
        state.drag = {
            type,
            id,
            startX: e.clientX,
            startY: e.clientY,
            initX: type === 'MACRO' ? inst.x : state.view.x,
            initY: type === 'MACRO' ? inst.y : state.view.y
        };
        els.viewport.classList.add('grabbing');
    }

    window.addEventListener('mousemove', (e) => {
        if (!state.drag) return;
        const dxPx = e.clientX - state.drag.startX;
        const dyPx = e.clientY - state.drag.startY;

        if (state.drag.type === 'CANVAS') {
            state.view.x = state.drag.initX + dxPx;
            state.view.y = state.drag.initY + dyPx;
        } else {
            // Macro Drag
            const dxMicrons = dxPx / state.view.scale;
            const dyMicrons = -(dyPx / state.view.scale);
            
            const rawX = state.drag.initX + dxMicrons;
            const rawY = state.drag.initY + dyMicrons;
            
            const inst = state.instances.find(i => i.id === state.drag.id);
            if (inst) {
                // If dragging a selected item, arguably we should move all selected items?
                // For simplicity/stability in this single-file without complex delta logic, 
                // dragging currently only moves the *clicked* item, breaking it away from selection relative pos.
                // To move all, user should use arrow keys as requested. 
                inst.x = snap(rawX, state.chip.gridSize);
                inst.y = snap(rawY, state.chip.gridSize);
            }
        }
        render();
    });

    window.addEventListener('mouseup', () => {
        state.drag = null;
        els.viewport.classList.remove('grabbing');
    });

    els.viewport.addEventListener('mousedown', (e) => {
        // Clicking empty space deselects
        state.selectedIds = [];
        render();
        startDrag(e, 'CANVAS', null);
    });

    // --- Modal ---
    function openRenameModal(id) {
        const targetId = id || (state.selectedIds.length === 1 ? state.selectedIds[0] : null);
        if (!targetId) return;
        
        const inst = state.instances.find(i => i.id === targetId);
        state.modal.id = targetId;
        els.renameInput.value = inst.name;
        els.renameError.textContent = '';
        els.renameModal.classList.add('open');
        els.renameInput.focus();
    }
    
    function closeRenameModal() {
        els.renameModal.classList.remove('open');
        state.modal.id = null;
    }

    function saveRename() {
        const newName = els.renameInput.value.trim();
        if (!newName) { els.renameError.textContent = "Name cannot be empty"; return; }
        if (state.instances.some(i => i.name === newName && i.id !== state.modal.id)) {
            els.renameError.textContent = "Name already exists"; return;
        }
        const inst = state.instances.find(i => i.id === state.modal.id);
        inst.name = newName;
        render();
        closeRenameModal();
    }

    // --- Inputs & YAML ---

    els.chipWidth.onchange = (e) => { state.chip.width = parseInt(e.target.value); render(); };
    els.chipHeight.onchange = (e) => { state.chip.height = parseInt(e.target.value); render(); };
    els.chipGrid.onchange = (e) => { state.chip.gridSize = parseInt(e.target.value); render(); };

    els.zoomInBtn.onclick = () => { state.view.scale = Math.min(5, state.view.scale * 1.1); render(); };
    els.zoomOutBtn.onclick = () => { state.view.scale = Math.max(0.01, state.view.scale * 0.9); render(); };
    
    els.selectAllBtn.onclick = selectAll;
    els.rotateBtn.onclick = rotateInstance;
    els.deleteBtn.onclick = deleteInstance;
    els.flipHBtn.onclick = flipH;
    els.flipVBtn.onclick = flipV;
    els.renameBtn.onclick = () => openRenameModal();
    
    els.cancelRenameBtn.onclick = closeRenameModal;
    els.saveRenameBtn.onclick = saveRename;
    els.renameInput.onkeydown = (e) => { if(e.key === 'Enter') saveRename(); };

    document.getElementById('addDefBtn').onclick = () => {
        state.library.push({
            id: generateId(),
            name: `MACRO_${state.library.length+1}`,
            width: 100,
            height: 100,
            color: COLORS[state.library.length % COLORS.length]
        });
        render();
    };

    els.exportBtn.onclick = () => {
        let text = `# Chip Configuration\nchip:\n  width: ${state.chip.width}\n  height: ${state.chip.height}\n  grid_size: ${state.chip.gridSize}\n\nMACROS:\n`;
        state.library.forEach(def => {
            const insts = state.instances.filter(i => i.defId === def.id);
            if (insts.length === 0) return;
            text += `  # ${def.name}\n  ${def.name}:\n`;
            
            // Re-adding the static paths logic
            text += `    gds:\n      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/${def.name}.gds\n`;
            text += `    lef:\n      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/${def.name}.lef\n`;
            text += `    vh:\n      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/${def.name}__blackbox.v\n`;
            text += `    lib:\n      "*_tt_025C_5v00":\n        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/${def.name}__tt_025C_5v00.lib\n`;
            text += `      "*_ff_n40C_5v50":\n        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/${def.name}__ff_n40C_5v50.lib\n`;
            text += `      "*_ss_125C_4v50":\n        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/${def.name}__ss_125C_4v50.lib\n`;
            
            text += `    instances:\n`;
            insts.forEach(i => {
                text += `      ${i.name}:\n        location: [${i.x}, ${i.y}]\n        orientation: ${i.orientation}\n`;
            });
            text += "\n";
        });
        const blob = new Blob([text], {type: 'text/yaml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'floorplan.yaml';
        a.click();
    };

    els.importBtn.onclick = () => els.fileInput.click();
    els.fileInput.onchange = (e) => {
        const f = e.target.files[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = (evt) => parseYaml(evt.target.result);
        r.readAsText(f);
        e.target.value = '';
    };

    function parseYaml(text) {
        // Very basic parsing regex
        try {
            const wm = text.match(/width:\s*(\d+)/);
            const hm = text.match(/height:\s*(\d+)/);
            const gm = text.match(/grid_size:\s*(\d+)/);
            if(wm) state.chip.width = parseInt(wm[1]);
            if(hm) state.chip.height = parseInt(hm[1]);
            if(gm) state.chip.gridSize = parseInt(gm[1]);

            // Simple line reader
            const lines = text.split('\n');
            let activeDef = null;
            let section = null;
            let newInsts = [];
            
            lines.forEach(line => {
                const trim = line.trim();
                if(!trim || trim.startsWith('#')) return;
                const indent = line.search(/\S|$/);
                
                if (trim === 'MACROS:') { section = 'MACROS'; return; }
                if (section === 'MACROS') {
                    if (indent === 2 && trim.endsWith(':')) {
                        const name = trim.slice(0, -1);
                        activeDef = state.library.find(d => d.name === name);
                    }
                    if (indent === 6 && activeDef && trim.endsWith(':')) {
                        const iName = trim.slice(0, -1);
                        newInsts.push({ id: generateId(), defId: activeDef.id, name: iName, x:0, y:0, orientation:'N' });
                    }
                    if (indent === 8 && newInsts.length > 0) {
                        const last = newInsts[newInsts.length-1];
                        if (trim.startsWith('location:')) {
                            const m = trim.match(/\[([\d\.]+),\s*([\d\.]+)\]/);
                            if(m) { last.x = parseFloat(m[1]); last.y = parseFloat(m[2]); }
                        }
                        if (trim.startsWith('orientation:')) {
                            last.orientation = trim.split(':')[1].trim();
                        }
                    }
                }
            });
            
            if (newInsts.length > 0) {
                state.instances = newInsts;
                render();
            }
        } catch(e) { alert("Parse Error"); console.error(e); }
    }

    // Init
    render();

</script>
</body>
</html>
